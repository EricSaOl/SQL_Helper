<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entrar · Materiais de SQL</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --ink:#152025; --muted:#56666D; --line:#D8E0E3;
  --p1:#0F7479; --p3:#6447B5; --err:#AE3F33; --err-soft:#F8E1DD; --ok:#1F7A4A; --ok-soft:#DDF1E5;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1315; --surface:#141C1F; --ink:#E2E9EB; --muted:#95A5AB; --line:#26343A;
  --p1:#52C3C8; --p3:#AC96F2; --err:#EE8A7C; --err-soft:#3D1F1B; --ok:#7FD3A4; --ok-soft:#163626; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1315; --surface:#141C1F; --ink:#E2E9EB; --muted:#95A5AB; --line:#26343A;
  --p1:#52C3C8; --p3:#AC96F2; --err:#EE8A7C; --err-soft:#3D1F1B; --ok:#7FD3A4; --ok-soft:#163626; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding:0 16px;display:grid;place-items:center;min-height:100vh}
[hidden]{display:none!important}
main{width:100%;max-width:380px;padding-block:48px;display:grid;gap:22px}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.1;letter-spacing:-.02em;margin:6px 0 0}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px}
label{display:grid;gap:4px;font-size:.88rem;font-weight:600}
input[type=text],input[type=password]{font:inherit;font-weight:400;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.check{display:flex;align-items:center;gap:8px;font-weight:400}
.check input{width:16px;height:16px;accent-color:var(--p1);margin:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--p3);outline-offset:2px}
button{font:inherit;font-weight:700;padding:11px;border:0;border-radius:8px;background:var(--p1);color:var(--surface);cursor:pointer}
button:hover{filter:brightness(1.08)}
button[disabled]{opacity:.6;cursor:wait}
.msg{font-size:.9rem;padding:9px 12px;border-radius:8px;margin:0}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.foot{font-size:.84rem;color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <div><span class="eyebrow">Projeto SQL</span><h1>Materiais de SQL</h1></div>
  <p class="msg err" id="erro" role="alert" hidden></p>
  <p class="msg ok" id="saiu" hidden>Você saiu do site.</p>
  <form id="form">
    <label for="usuario">Usuário<input type="text" id="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label for="senha">Senha<input type="password" id="senha" autocomplete="current-password" required></label>
    <label class="check" for="lembrar"><input type="checkbox" id="lembrar">Manter conectado neste computador</label>
    <button type="submit" id="entrar">Entrar</button>
  </form>
  <p class="foot">Acesso só para usuários cadastrados. Para pedir um acesso, fale com o administrador do site.</p>
</main>
<script>
const CHAVE = 'cofre-chave';
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const hex = buf => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
function erro(t){ $('erro').textContent = t; $('erro').hidden = false; }
function destino(){
  const v = q.get('volta') || 'index.html';
  return /^[\w\-./%?=&#]*$/.test(v) && !v.startsWith('/') && !v.includes('//') && !v.includes(':') ? v : 'index.html';
}
if (q.get('sair')) {
  try { sessionStorage.removeItem(CHAVE); localStorage.removeItem(CHAVE); } catch(e) {}
  $('saiu').hidden = false;
}
if (location.protocol === 'file:') erro('O login só funciona com o site publicado. No computador, abra o arquivo index.html da pasta de conteúdo.');
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('erro').hidden = true; $('saiu').hidden = true;
  const btn = $('entrar'); btn.disabled = true; btn.textContent = 'Conferindo…';
  try {
    const usuario = $('usuario').value.trim().toLowerCase();
    const r = await fetch('acessos.json', {cache:'no-store'});
    if (!r.ok) throw new Error('lista');
    const lista = await r.json();
    const id = hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('cofre:' + usuario)));
    const a = lista.usuarios && lista.usuarios[id];
    if (!a) throw new Error('senha');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('senha').value), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:bytes(a.sal), iterations:a.iter}, base, 256);
    const w = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    let chave;
    try { chave = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(a.iv)}, w, bytes(a.k)); } catch(x) { throw new Error('senha'); }
    try {
      sessionStorage.setItem(CHAVE, b64(chave));
      if ($('lembrar').checked) localStorage.setItem(CHAVE, b64(chave)); else localStorage.removeItem(CHAVE);
    } catch(x) {}
    location.href = destino();
  } catch(err) {
    erro(err.message === 'senha' ? 'Usuário ou senha incorretos.' : 'Não foi possível conferir o acesso agora. Confira a internet e tente de novo.');
    btn.disabled = false; btn.textContent = 'Entrar';
    $('senha').select();
  }
});
$(q.get('sair') ? 'usuario' : 'usuario').focus();
</script>
</body>
</html>
